<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kubo Cà Phê — offline-first coffee shop POS">

  <!-- Full screen when added to the iPad or iPhone home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    Deliberately "default" rather than "black-translucent".

    Translucent lets the page run underneath the status bar, and on an
    iPhone opened from the home screen iOS then reports a page that is
    taller than the part of it you can actually touch. Flutter lays the
    screen out to the height it was given and hit-tests against the other
    one, so every tap lands a little low, and further down the screen the
    gap is wide enough that SIGN IN presses the button under it. Rotating
    the phone and back fixed it only because rotating forces a re-measure.

    The till gains nothing from drawing under the clock, so it no longer
    tries. The strip at the top takes the theme colour instead.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kubo Cà Phê">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Signing in talks to these. Starting the handshakes now means they are
       already warm by the time she types her password, rather than adding a
       round trip each to the slowest moment in the app. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <title>Kubo Cà Phê</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The app's own ground, so the first paint is never a flash of white
       — or, at night, a flash of anything. */
    html, body { margin: 0; padding: 0; height: 100%; background: #F6F6F7; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0B0B0C; }
    }

    /* The app is several megabytes of renderer and code, and until it has
       parsed there is nothing on screen at all. A plain coloured page for
       that long reads as a phone that has stopped responding, so the name
       goes up in the browser's first paint — no image to fetch, no font to
       wait for. It is removed the moment Flutter draws its first frame. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0B0B0C;
      transition: opacity 180ms ease-out;
    }
    #boot .name { font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
    #boot .what { font-size: 13px; opacity: 0.6; }
    #boot svg { width: 56px; height: auto; }
    #boot.done { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      #boot { color: #F6F6F7; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 120 60" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="7" stroke-linecap="round">
      <path d="M14 52 L60 12 L106 52"></path>
      <path d="M48 8 L72 30"></path>
    </svg>
    <div class="name">Kubo Cà Phê</div>
    <div class="what">Opening the till…</div>
  </div>

  <script>
    // Serve the renderer from this build rather than from Google's CDN.
    // The whole point of the app is that it works without internet, and a
    // renderer fetched at runtime would break that.
    window.flutterConfiguration = { canvasKitBaseUrl: 'canvaskit/' };
    window.dartPdfJsBaseUrl = 'pdfjs/';
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Makes Flutter measure the screen again.
    //
    // This is the rotate-and-rotate-back trick, done automatically. On an
    // iPhone opened from the home screen the viewport iOS reports at
    // startup is not always the one the finger is touching, and Flutter
    // only finds out when something changes size — which is why turning the
    // phone sideways and back used to be the cure. Nudging the page by a
    // hair's breadth and putting it straight back makes that happen without
    // her having to know the trick, and is invisible on screen.
    //
    // It is cheap, so it runs at every moment the mismatch can appear:
    // after the first frame, when the app is returned to from the
    // background, and whenever iOS changes the visible area itself.
    var nudging = false;
    function remeasure() {
      if (nudging) return;
      nudging = true;
      var root = document.documentElement;
      var was = root.style.height;
      root.style.height = 'calc(100% - 1px)';
      requestAnimationFrame(function () {
        root.style.height = was;
        requestAnimationFrame(function () {
          window.dispatchEvent(new Event('resize'));
          nudging = false;
        });
      });
    }

    window.addEventListener('pageshow', function () { setTimeout(remeasure, 60); });
    window.addEventListener('orientationchange', function () {
      setTimeout(remeasure, 120);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        setTimeout(remeasure, 60);
      });
    }

    // Take the splash down as soon as there is a real frame behind it.
    window.addEventListener('flutter-first-frame', function () {
      // Before anything else: the first frame is exactly where the wrong
      // viewport shows up, and a till whose buttons press the wrong thing
      // is worse than a slow one.
      remeasure();
      setTimeout(remeasure, 300);
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 250);

      // Receipt previews need pdf.js, and it used to load before the app did
      // — a third of a megabyte in front of the one thing she opens the
      // phone for. It is wanted minutes later, if at all, so it follows the
      // first frame instead of racing it. See web/pdfjs/README.md for why it
      // is served from this build rather than fetched from a CDN on demand.
      var pdf = document.createElement('script');
      pdf.src = 'pdfjs/pdf.min.js';
      pdf.onload = function () {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              'pdfjs/pdf.worker.min.js';
        }
      };
      document.body.appendChild(pdf);

      // Tell the cache what this launch actually needed, so that the next
      // one — and the first one with no signal — has all of it.
      setTimeout(function () {
        var worker = navigator.serviceWorker && navigator.serviceWorker.controller;
        if (!worker) return;
        try {
          var urls = performance.getEntriesByType('resource')
            .map(function (e) { return e.name; })
            .filter(function (u) { return u.indexOf(location.origin) === 0; });
          worker.postMessage({ kind: 'keep', urls: urls });
        } catch (e) { /* not worth breaking the app over */ }
      }, 2000);
    });

    // Kubo's own cache. Without it every launch re-downloaded the whole app
    // and it could not start without internet at all.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Kubo is running without its cache:', e);
        });
      });
    }
  </script>
</body>
</html>
