name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not "whatever stable is today".
          #
          # CI went red without a line of this app changing: a Flutter
          # release deprecated package:flutter/material.dart in favour of
          # material_ui, and because `flutter analyze` fails on infos,
          # every file in the app became an error at once. An upstream
          # release should not be able to break a shop's build overnight.
          #
          # This is the version the app is developed and tested against.
          # Moving it is a deliberate change made together with the
          # migration it needs, not something that happens unattended.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  ios-build:
    name: iOS build (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The Linux job cannot compile the iOS target; this is the gate that
      # proves the iPhone/iPad build still works.
      #
      # Built for the simulator rather than for a device. `--no-codesign`
      # stopped being enough once the Google Sign-In SDK arrived: Xcode
      # compiles the app, and then packaging it for a device demands a
      # Development Team for the embedded frameworks. Signing in CI would
      # mean putting the owner's Apple credentials in this repository, which
      # is a far worse trade than losing the device-packaging step. The
      # compile — every plugin, every line of Dart, for iOS — still happens.
      - name: Build iOS (simulator, unsigned)
        run: flutter build ios --debug --simulator
