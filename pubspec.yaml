name: kubo_pos
description: "Kubo Cà Phê — offline-first coffee shop POS and business management app for iPhone and iPad."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local database (offline-first)
  sqflite: ^2.4.1
  sqflite_common: ^2.5.4

  # Paths & files
  path: ^1.9.0
  path_provider: ^2.1.5

  # Formatting (PHP currency, dates)
  intl: ^0.20.1

  # Hashing for order-pattern signatures and backup manifests
  crypto: ^3.0.6

  # Excel exports. SQLite stays the database; .xlsx is only a report.
  excel: ^4.0.6

  # Sharing an export or a backup off the device.
  share_plus: ^10.1.4

  # Small utilities
  collection: ^1.19.0
  meta: ^1.16.0

  sqflite_common_ffi_web: any
  pdf: ^3.12.0
  printing: ^5.14.3
  image: ^4.3.0
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Lets the whole database + engine test suite run on desktop/CI without a device.
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/ReceiptSans-Regular.ttf
    - assets/fonts/ReceiptSans-Bold.ttf
